name: sonda-news (temporal)
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          t(){ echo "== $1"; curl -s -m 10 -A "Mozilla/5.0" -o /tmp/o -w "%{http_code} %{size_download}B %{time_total}s\n" "$2"; head -c 300 /tmp/o; echo; }
          t upbit-notices "https://api-manager.upbit.com/api/v1/announcements?os=web&page=1&per_page=5&category=trade"
          t upbit-notices2 "https://api-manager.upbit.com/api/v1/notices?page=1&per_page=5"
          t binance-cms "https://www.binance.com/bapi/composite/v1/public/cms/article/list/query?type=1&catalogId=48&pageNo=1&pageSize=5"
          t okx "https://www.okx.com/api/v5/support/announcements?annType=announcements-new-listings"
          t bybit "https://api.bybit.com/v5/announcements/index?locale=en-US&type=new_crypto&limit=5"
          t coinbase-products "https://api.exchange.coinbase.com/products"
          t bitvavo-markets "https://api.bitvavo.com/v2/markets"
          t kucoin "https://api.kucoin.com/api/v3/announcements?annType=new-listings&pageSize=5"
          t bithumb "https://api.bithumb.com/public/ticker/ALL_KRW"
