name: Asistente · prueba de Gemini (a mano)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Probar modelos con un mensaje del tamaño real
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          node runner/conocimiento.mjs >/dev/null 2>&1 || true
          node -e '
          const fs=require("fs");const K=process.env.GEMINI_KEY;const sys="Eres el asistente.\n"+(fs.existsSync("conocimiento.md")?fs.readFileSync("conocimiento.md","utf8"):"x".repeat(50000));
          (async()=>{const l=await (await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key="+K)).json();console.log("modelos flash:",(l.models||[]).map(m=>m.name).filter(n=>/flash/.test(n)).join(", "));
          for(const m of ["gemini-3.5-flash","gemini-flash-latest","gemini-2.5-flash"]){const t=Date.now();try{const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${K}`,{method:"POST",headers:{"Content-Type":"application/json"},signal:AbortSignal.timeout(60000),body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{role:"user",parts:[{text:"buenas que tal"}]}],generationConfig:{temperature:0.4,maxOutputTokens:1500}})});const j=await r.json();console.log(m,"HTTP",r.status,((Date.now()-t)/1000).toFixed(1)+"s",r.ok?JSON.stringify(j.candidates?.[0]?.content?.parts?.[0]?.text||"").slice(0,120):JSON.stringify(j.error||j).slice(0,160))}catch(e){console.log(m,"fallo",e.message,((Date.now()-t)/1000).toFixed(1)+"s")}}})()'
