name: Laboratorio · ayudante IA (Gemini, gratis)
# v366 · cada 6 h (antes de las rondas del laboratorio de cripto) pide a Gemini ideas nuevas para los laboratorios.
# Solo propone: sus ideas pasan el mismo examen que todas. Sin la clave GEMINI_KEY no hace nada.
on:
  schedule:
    - cron: "3 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ia-lab
  cancel-in-progress: false
jobs:
  ia:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            runner
            index.html
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Pedir ideas a la IA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          NVIDIA_KEY: ${{ secrets.NVIDIA_KEY }}
          ZAI_KEY: ${{ secrets.ZAI_KEY }}
        run: timeout 1140 node runner/ia-lab.mjs
      - name: 🚨 Avisar por Telegram si algo ha fallado
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          QUE: ${{ github.workflow }}
          ENLACE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT" ] || exit 0
          curl -s -m 20 -o /dev/null --data-urlencode "chat_id=$TELEGRAM_CHAT" --data-urlencode "text=🚨 Bot Trading: ha fallado «$QUE» ($(TZ=Europe/Madrid date +'%d/%m %H:%M')). Se volverá a intentar solo; si te llega varias veces seguidas, avísame. Detalle: $ENLACE" "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" || true
