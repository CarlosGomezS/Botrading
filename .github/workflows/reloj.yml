name: Reloj (lo lanza cron-job.org cada 5 min)

# v1.0 · ⏰ RELOJ FIABLE (24/11/2026): GitHub casi nunca lanza a su hora los flujos programados de este repositorio (en 2 días, el
#   vigilante «cada 10 min» se lanzó 3 veces) y las cadenas que se relanzaban solas gastaban demasiado. Por eso un servicio externo
#   gratuito (cron-job.org) pulsa este flujo cada 5 minutos con un token que SOLO puede lanzar flujos (no lee secretos ni toca dinero).
#   Cada vez: lee Telegram (/parar, /seguir); cada 15 min lanza el bot de cripto; cada hora, el vigilante (laboratorios y Hyperliquid).
#   Corre en unos 30 s. Los horarios de cada flujo siguen puestos por si GitHub sí los lanza.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: reloj
  cancel-in-progress: false

jobs:
  reloj:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: runner
      - name: Telegram (/parar y /seguir)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          TELEGRAM_USER: ${{ secrets.TELEGRAM_USER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: timeout 100 node runner/telegram.mjs
      - name: Qué toca ahora
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: timeout 150 bash runner/reloj.sh
