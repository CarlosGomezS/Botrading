name: Cripto · guardar opción del dinero real

# v240 · la app lo lanza al pulsar un botón de la tarjeta 💶 Dinero real (método, exchange, cantidad, parar/seguir).
on:
  workflow_dispatch:
    inputs:
      cambio:
        description: "JSON con el cambio"
        required: true

permissions:
  contents: write

concurrency:
  group: cripto-ctl
  cancel-in-progress: false

jobs:
  guardar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: runner
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Guardar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAMBIO: ${{ inputs.cambio }}
        run: node runner/cripto-ctl.mjs
