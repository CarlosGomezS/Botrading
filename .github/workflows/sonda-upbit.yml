name: sonda-upbit (temporal)
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: |
          cat > p.mjs <<'X'
          const U=process.argv[2];
          const H={a:{"User-Agent":"Mozilla/5.0 (bot-trading)",Accept:"application/json"},b:{"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36",Accept:"application/json, text/plain, */*","Accept-Language":"ko-KR,ko;q=0.9,en;q=0.8",Origin:"https://upbit.com",Referer:"https://upbit.com/"}};
          for (const [k,h] of Object.entries(H)) { const c={}; for (let i=0;i<20;i++){ const t=Date.now(); let s; try{ const r=await fetch(U,{headers:h}); s=r.status; await r.text(); }catch(e){s="err"} c[s]=(c[s]||0)+1; await new Promise(r=>setTimeout(r,Math.max(0,500-(Date.now()-t)))); } console.log(k,JSON.stringify(c)); }
          X
          node p.mjs "https://api.upbit.com/v1/market/all?isDetails=false"; node p.mjs "https://api-manager.upbit.com/api/v1/announcements?os=web&page=1&per_page=10&category=trade"
