name: Diagnóstico · IA gratuitas disponibles
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ¿Se pueden usar desde el navegador (CORS)?
        run: |
          for u in https://integrate.api.nvidia.com/v1/chat/completions https://integrate.api.nvidia.com/v1/models https://api.z.ai/api/paas/v4/chat/completions https://api.groq.com/openai/v1/chat/completions; do
            h=$(curl -s -m 15 -D - -o /dev/null -X OPTIONS -H "Origin: https://carlosgomezs.github.io" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: authorization,content-type" "$u" | tr -d '\r' | grep -i -E "^HTTP|access-control-allow-(origin|headers)" | tr '\n' ' ')
            echo "$u → $h"
          done
