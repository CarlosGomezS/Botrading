name: Cartera real (Trading 212)

# Sigue con DINERO REAL el método elegido en «💶 Real → Ajustes de la cartera real» (archivo real-ajustes.json).
# No usa navegador: tarda menos de un minuto. Guarda su historial en la rama «real» (real.json), aparte del simulador.
# Cuándo corre (lunes a viernes, hora de España; GitHub puede retrasarse unos minutos):
#  - Revisión diaria hacia las 10:17 (con la Bolsa de Fráncfort ya abierta y los precios estables). Si GitHub se salta
#    ese disparo, lo recupera el de las ~11:17 o el de la tarde. Cada disparo mira primero si hoy ya está hecho.
#  - Disparos de tarde (~15:47 y ~16:47): solo hacen algo si la revisión de hoy no se pudo hacer, o si hay acciones de EE. UU. aplazadas.
#  - Foto del valor tras el cierre europeo (~17:47-18:47): solo guarda el valor de la cuenta para la gráfica.
# Desde la web (botones de la pestaña Real) se lanza con una «accion»: aprobar, rechazar, probar, foto, reanudar o normal.
on:
  schedule:
    - cron: "17 8 * * 1-5"
    - cron: "17 9 * * 1-5"
    - cron: "47 13 * * 1-5"
    - cron: "47 14 * * 1-5"
    - cron: "47 16 * * 1-5"
  workflow_dispatch:
    inputs:
      accion:
        description: "Qué hacer: normal (revisar y operar según el modo), aprobar, rechazar, probar (conexión), foto (solo guardar el valor), reanudar (quitar la pausa)"
        type: choice
        options: ["normal", "aprobar", "rechazar", "probar", "foto", "reanudar"]
        default: "probar"
      plan:
        description: "Identificador de la propuesta (solo para aprobar/rechazar; lo rellena la web)"
        type: string
        default: ""

permissions:
  contents: write

# grupo propio: no espera al simulador (que puede tardar horas) y nunca corren dos a la vez sobre la misma cuenta
concurrency:
  group: cartera-real
  cancel-in-progress: false

jobs:
  real:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar
        working-directory: runner
        run: npm install --no-audit --no-fund --ignore-scripts nodemailer@6.9.16
      - name: Cartera real
        working-directory: runner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCION: ${{ github.event_name == 'schedule' && (github.event.schedule == '47 16 * * 1-5' && 'foto' || 'normal') || inputs.accion }}
          PLAN_ID: ${{ inputs.plan }}
          T212_KEY: ${{ secrets.T212_KEY }}
          T212_SECRET: ${{ secrets.T212_SECRET }}
          REAL_VIEW_PASS: ${{ secrets.REAL_VIEW_PASS }}
          EMAIL: ${{ secrets.EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node real.mjs
