name: Diagnóstico · conexión con Trading 212 y secretos puestos
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: runner
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node runner/diag-secretos.mjs
        env:
          NOMBRES: "GROQ_KEY OPENROUTER_KEY T212_KEY T212_SECRET REAL_VIEW_PASS TELEGRAM_TOKEN TELEGRAM_CHAT BITVAVO_KEY BITVAVO_SECRET OKX_KEY OKX_SECRET OKX_PASSPHRASE GEMINI_KEY ALPACA_KEY TWELVEDATA_KEY"
          T212_KEY: ${{ secrets.T212_KEY }}
          T212_SECRET: ${{ secrets.T212_SECRET }}
          REAL_VIEW_PASS: ${{ secrets.REAL_VIEW_PASS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          BITVAVO_KEY: ${{ secrets.BITVAVO_KEY }}
          BITVAVO_SECRET: ${{ secrets.BITVAVO_SECRET }}
          OKX_KEY: ${{ secrets.OKX_KEY }}
          OKX_SECRET: ${{ secrets.OKX_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
      - run: node runner/diag-t212.mjs
        env:
          T212_KEY: ${{ secrets.T212_KEY }}
          T212_SECRET: ${{ secrets.T212_SECRET }}
