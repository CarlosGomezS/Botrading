name: Telegram (botones de la cartera real)

# Cada ~5 minutos mira si has pulsado «Aprobar» o «Rechazar» en Telegram y, si es así, lanza «Cartera real» con esa acción.
# También contesta a /start con tu número de chat (para configurarlo la primera vez).
# Solo obedece a TU chat (secreto TELEGRAM_CHAT). Si no hay TELEGRAM_TOKEN, termina en segundos sin hacer nada.
on:
  schedule:
    - cron: "*/5 5-21 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: runner
      - name: Leer Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node runner/telegram.mjs
      # v91 · arranque de seguridad del laboratorio: GitHub a veces no activa los horarios de los flujos nuevos. Si la última ronda
      # del laboratorio tiene más de 2 horas (y estamos entre las 03 y las 19 UTC), la lanza desde aquí.
      - name: ¿Le toca ronda al laboratorio?
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          H=$(date -u +%H); H=$((10#$H))
          if [ "$H" -lt 3 ] || [ "$H" -gt 19 ]; then echo "Fuera de horario del laboratorio."; exit 0; fi
          R="repos/${{ github.repository }}/actions/workflows/laboratorio.yml/runs?per_page=1"
          st=$(gh api "$R" -q '.workflow_runs[0].status // "none"')
          t=$(gh api "$R" -q '.workflow_runs[0].created_at // "1970-01-01T00:00:00Z"')
          age=$(( ( $(date +%s) - $(date -d "$t" +%s) ) / 60 ))
          echo "Última ronda: $t ($age min, $st)"
          if [ "$st" = "in_progress" ] || [ "$st" = "queued" ]; then exit 0; fi
          if [ "$age" -ge 125 ]; then gh api -X POST "repos/${{ github.repository }}/actions/workflows/laboratorio.yml/dispatches" -f ref=main && echo "Ronda del laboratorio lanzada."; fi
      # v95 · que el bot no se pare NUNCA: GitHub desactiva los horarios de un repositorio público tras 60 días sin cambios.
      # Una vez al día comprueba que todos los procesos siguen activos (si alguno está desactivado, lo reactiva) y,
      # si la rama principal lleva más de 30 días sin cambios, deja una marca (.vivo) para que GitHub vea actividad.
      - name: Mantener vivo el bot
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          H=$(date -u +%H); M=$(date -u +%M); H=$((10#$H)); M=$((10#$M))
          if [ "$H" -ne 12 ] || [ "$M" -ge 10 ]; then exit 0; fi
          R="repos/${{ github.repository }}"
          for wf in diario.yml historico.yml laboratorio.yml real.yml telegram.yml; do
            st=$(gh api "$R/actions/workflows/$wf" -q .state 2>/dev/null || echo "?")
            if [ "$st" != "active" ] && [ "$st" != "?" ]; then gh api -X PUT "$R/actions/workflows/$wf/enable" && echo "Reactivado: $wf"; fi
          done
          last=$(gh api "$R/commits?sha=main&per_page=1" -q '.[0].commit.committer.date')
          age=$(( ( $(date +%s) - $(date -d "$last" +%s) ) / 86400 ))
          echo "Último cambio en main hace $age días"
          if [ "$age" -ge 30 ]; then
            sha=$(gh api "$R/contents/.vivo?ref=main" -q .sha 2>/dev/null || true)
            body=$(date -u +%Y-%m-%dT%H:%M:%SZ | base64)
            if [ -n "$sha" ]; then gh api -X PUT "$R/contents/.vivo" -f message="Bot vivo $(date -u +%F)" -f content="$body" -f branch=main -f sha="$sha"; else gh api -X PUT "$R/contents/.vivo" -f message="Bot vivo $(date -u +%F)" -f content="$body" -f branch=main; fi
          fi
