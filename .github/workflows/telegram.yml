name: Telegram (botones de la cartera real)

# Cada ~5 minutos mira si has pulsado «Aprobar» o «Rechazar» en Telegram y, si es así, lanza «Cartera real» con esa acción.
# También contesta a /start con tu número de chat (para configurarlo la primera vez).
# Solo obedece a TU chat (secreto TELEGRAM_CHAT). Si no hay TELEGRAM_TOKEN, termina en segundos sin hacer nada.
on:
  schedule:
    - cron: "*/5 * * * *"   # v233 · las 24 h: /parar debe funcionar siempre (dinero real en Bitvavo)
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: runner
      - name: Leer Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          TELEGRAM_USER: ${{ secrets.TELEGRAM_USER }}   # v479 · opcional: solo hace falta si usas un grupo (en un chat privado, tu chat ya es tu usuario)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node runner/telegram.mjs
      # v95 · que el bot no se pare NUNCA: GitHub desactiva los horarios de un repositorio público tras 60 días sin cambios.
      # Cada vez que se ejecuta comprueba que todos los procesos siguen activos (si alguno está desactivado, lo reactiva) y,
      # si la rama principal lleva más de 30 días sin cambios, deja una marca (.vivo) para que GitHub vea actividad.
      - name: Mantener vivo el bot
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          R="repos/${{ github.repository }}"
          for wf in telegram.yml meme.yml hl-real.yml examen-largo.yml caza-lab.yml ia-lab.yml; do
            st=$(gh api "$R/actions/workflows/$wf" -q .state 2>/dev/null || echo "?")
            if [ "$st" != "active" ] && [ "$st" != "?" ]; then gh api -X PUT "$R/actions/workflows/$wf/enable" && echo "Reactivado: $wf"; fi
          done
          last=$(gh api "$R/commits?sha=main&per_page=1" -q '.[0].commit.committer.date')
          age=$(( ( $(date +%s) - $(date -d "$last" +%s) ) / 86400 ))
          echo "Último cambio en main hace $age días"
          if [ "$age" -ge 30 ]; then
            sha=$(gh api "$R/contents/.vivo?ref=main" -q .sha 2>/dev/null || true)
            body=$(date -u +%Y-%m-%dT%H:%M:%SZ | base64)
            if [ -n "$sha" ]; then gh api -X PUT "$R/contents/.vivo" -f message="Bot vivo $(date -u +%F)" -f content="$body" -f branch=main -f sha="$sha"; else gh api -X PUT "$R/contents/.vivo" -f message="Bot vivo $(date -u +%F)" -f content="$body" -f branch=main; fi
          fi
      - name: 🚨 Avisar por Telegram si algo ha fallado
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          QUE: ${{ github.workflow }}
          ENLACE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT" ] || exit 0
          curl -s -m 20 -o /dev/null --data-urlencode "chat_id=$TELEGRAM_CHAT" --data-urlencode "text=🚨 CriptoBot: ha fallado «$QUE» ($(TZ=Europe/Madrid date +'%d/%m %H:%M')). Se volverá a intentar solo; si te llega varias veces seguidas, avísame. Detalle: $ENLACE" "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" || true
