name: Vigilante · que el bot y los laboratorios nunca se queden parados

# v262 · cada 10 min: si el bot de cada minuto lleva > 6 min sin publicar, o un laboratorio > 20 min, y no hay ninguna ejecución en marcha, los relanza.
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: vigilante
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar y relanzar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R: ${{ github.repository }}
        run: |
          edad() { t=$(gh api "repos/$R/contents/$1?ref=$2" -H "Accept: application/vnd.github.raw" 2>/dev/null | jq -r '.meta.t // .t // empty' 2>/dev/null); [ -z "$t" ] && { echo 99999; return; }; echo $(( $(date -u +%s) - $(date -u -d "$t" +%s) )); }
          vivo() { gh api "repos/$R/actions/workflows/$1/runs?per_page=10" -q '[.workflow_runs[]|select(.status=="in_progress" or .status=="queued" or .status=="pending")]|length' 2>/dev/null || echo 0; }
          lanza() { st=$(gh api "repos/$R/actions/workflows/$1" -q .state 2>/dev/null); if [ -n "$st" ] && [ "$st" != "active" ]; then echo "$1 está desactivado a propósito ($st): no se relanza"; return 0; fi; for i in 1 2 3; do gh api -X POST "repos/$R/actions/workflows/$1/dispatches" -f ref=main && { echo "relanzado $1"; return 0; }; sleep 15; done; }
          e=$(edad bitvavo.json bitvavo); v=$(vivo meme.yml); echo "bot: hace ${e}s · ejecuciones vivas: $v"
          if [ "$e" -gt 360 ]; then if [ "$v" = "0" ]; then lanza meme.yml; else echo "hay una en marcha; si en 20 min sigue sin publicar, se cancela"; id=$(gh api "repos/$R/actions/workflows/meme.yml/runs?status=in_progress&per_page=1" -q '.workflow_runs[0].id'); if [ -n "$id" ] && [ "$e" -gt 1200 ]; then gh api -X POST "repos/$R/actions/runs/$id/cancel"; sleep 60; lanza meme.yml; fi; fi; fi
          l=$(edad lab-eq.json bitvavo-lab-eq); w=$(vivo cripto-lab.yml); echo "laboratorio: hace ${l}s · ejecuciones vivas: $w"
          # v295 · TODOS los laboratorios (los de Bitvavo y los de OKX van en máquinas distintas): si alguno lleva > 40 min sin publicar y no hay tramo vivo, se relanza
          peor=0; cual=""; for k in eq turbo mix cuant consenso tend explora riesgo mixokx eqokx turbookx cuantokx consensookx tendokx exploraokx riesgookx; do x=$(edad lab-$k.json bitvavo-lab-$k); [ "$x" -gt "$peor" ] && { peor=$x; cual=$k; }; done
          echo "laboratorio más atrasado: $cual hace ${peor}s"
          if { [ "$l" -gt 1200 ] || [ "$peor" -gt 2400 ]; } && [ "$w" = "0" ]; then lanza cripto-lab.yml; fi
          # v295 · examen de un año: si el último examen bueno tiene > 5 h y no hay uno en marcha, se lanza
          x=$(edad examen-largo.json examen-largo); xv=$(vivo examen-largo.yml); echo "examen de un año: hace ${x}s · vivos: $xv"
          if [ "$x" -gt 18000 ] && [ "$xv" = "0" ]; then lanza examen-largo.yml; fi
          # v461 · 💧 Hyperliquid vigilado TAMBIÉN desde aquí (independiente de la cadena del bot): si su última ronda tiene > 75 min, se lanza una (el candado de la hora impide duplicarla)
          hl=$(edad hl-real.json hl-real); hv=$(vivo hl-real.yml); echo "hyperliquid: última ronda hace ${hl}s · vivos: $hv"
          if [ "$hl" -lt 99999 ] && [ "$hl" -gt 4500 ] && [ "$hv" = "0" ]; then lanza hl-real.yml; fi
      - name: 🚨 Avisar por Telegram si algo ha fallado
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          QUE: ${{ github.workflow }}
          ENLACE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT" ] || exit 0
          curl -s -m 20 -o /dev/null --data-urlencode "chat_id=$TELEGRAM_CHAT" --data-urlencode "text=🚨 Bot Trading: ha fallado «$QUE» ($(TZ=Europe/Madrid date +'%d/%m %H:%M')). Se volverá a intentar solo; si te llega varias veces seguidas, avísame. Detalle: $ENLACE" "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" || true
