name: Vigilante intradía (10 métodos de day trading, cada hora con Wall Street abierto)

on:
  schedule:
    - cron: "7 14-21 * * 1-5"    # cada hora (UTC); el script se salta lo que caiga fuera de 9:40-18:00 de Nueva York
    - cron: "37 21 * * 1-5"      # tras el cierre (en invierno el cierre es a las 21:00 UTC)
    - cron: "37 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-estado
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ¿Está abierto (o a punto) Wall Street?
        id: ny
        run: |
          DOW=$(TZ=America/New_York date +%u); HM=$(TZ=America/New_York date +%H%M)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$DOW" -le 5 ] && [ "$HM" -ge 0940 ] && [ "$HM" -le 1800 ]; }; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "Fuera del horario de Nueva York ($HM): nada que hacer."
          fi
      - uses: actions/checkout@v4
        if: steps.ny.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.ny.outputs.go == 'true'
        with:
          node-version: 22
      - name: Instalar navegador
        if: steps.ny.outputs.go == 'true'
        working-directory: runner
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Vigilar
        if: steps.ny.outputs.go == 'true'
        working-directory: runner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          POLYGON_KEY: ${{ secrets.POLYGON_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          EMAIL: ${{ secrets.EMAIL }}
          WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: node runner.mjs vigilante
