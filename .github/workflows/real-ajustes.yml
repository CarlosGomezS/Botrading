name: Ajustes de la cartera real

# Guarda en real-ajustes.json, CIFRADOS, los ajustes de la cartera real (lo rellena la web: pestaña Real → Ajustes de la cartera real).
# Cada valor tiene su rango seguro (runner/real-cfg.mjs); si algo se sale, se rechaza y no se guarda nada.
# El flujo «Reiniciar todo» del simulador NO toca este archivo ni el historial real.
on:
  workflow_dispatch:
    inputs:
      json:
        description: 'Ajustes CIFRADOS con la contraseña de la cartera (los envía la web). No escribas aquí nada en claro: este repositorio es público.'
        type: string
        default: "{}"

permissions:
  contents: write

concurrency:
  group: ajustes-real
  cancel-in-progress: false

jobs:
  guardar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validar y guardar real-ajustes.json
        env:
          REAL_JSON: ${{ inputs.json }}
          REAL_VIEW_PASS: ${{ secrets.REAL_VIEW_PASS }}
          REAL_VIEW_PASS_OLD: ${{ secrets.REAL_VIEW_PASS_OLD }}
        run: |
          node runner/real-cfg.mjs real-ajustes.json
          git config user.name "bot-trading"
          git config user.email "bot-trading@users.noreply.github.com"
          git add real-ajustes.json
          if git diff --cached --quiet; then echo "Sin cambios"; else
            git commit -q -m "Ajustes de la cartera real"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break || sleep 3; done
          fi
