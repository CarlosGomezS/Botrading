name: Probar avisos (móvil y correo)

# Envía un aviso de prueba al móvil (ntfy) y un correo (Web3Forms) y deja un informe «prueba-de-avisos».
# En el informe y en el registro de este paso verás qué secretos faltan.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-estado
  cancel-in-progress: false

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar navegador
        working-directory: runner
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Enviar avisos de prueba
        working-directory: runner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          POLYGON_KEY: ${{ secrets.POLYGON_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          EMAIL: ${{ secrets.EMAIL }}
          WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node runner.mjs test
