name: Cripto · bot de cada minuto (Bitvavo y OKX · ficticio y, si lo activas, dinero real)

# v218 · solo queda lo que puede dar dinero: Bitvavo (criptos grandes y volátiles en euros, dinero ficticio). Las memecoins, el Turbo,
# Volátiles y Noticias se han parado (el código sigue en el repositorio por si algún día se quieren recuperar). Nunca toca Trading 212.
# v1.0 · 🪶 una vuelta cada 15 min (ya no en cadena las 24 h: GitHub no permite usar Actions como un servidor encendido todo el día).
on:
  schedule:
    - cron: "2,17,32,47 * * * *"   # v1.0 · 🪶 una vuelta cada 15 min (antes, en cadena las 24 h)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: memes
  cancel-in-progress: false

jobs:
  memes:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # v1.0 · 🪶 una vuelta + la ronda de Hyperliquid (máx. 12 min)
    steps:
      - name: ¿Ya hay otra cadena esperando?
        id: dup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # v262 · solo se salta si hay OTRA ejecución de verdad en marcha (antes contaba las «en cola» y dos programadas se bloqueaban entre sí)
          v=$(gh api "repos/${{ github.repository }}/actions/workflows/meme.yml/runs?status=in_progress&per_page=10" -q '[.workflow_runs[]|select(.id != ${{ github.run_id }})]|length' 2>/dev/null || echo 0)
          echo "Otras en marcha: $v"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${v:-0}" -gt 0 ] 2>/dev/null; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.dup.outputs.go == 'true'
        with:
          sparse-checkout: runner
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.dup.outputs.go == 'true'
        with:
          node-version: 22
      - name: Librerías de firma de Hyperliquid
        if: steps.dup.outputs.go == 'true'
        continue-on-error: true
        run: |
          mkdir -p /tmp/hl && cd /tmp/hl && npm init -y >/dev/null && npm i --no-audit --no-fund --ignore-scripts --before=2026-06-01 ethers@6.13.4 @msgpack/msgpack@2.8.0 >/dev/null && ln -sfn /tmp/hl/node_modules "$GITHUB_WORKSPACE/runner/node_modules" && echo ok
      - name: Una vuelta (cada 15 min)
        if: steps.dup.outputs.go == 'true'
        env:
          DIARIO_LOG: /tmp/diario.jsonl
          NODE_OPTIONS: --import ${{ github.workspace }}/runner/diario-captura.mjs
          DIARIO_SOLO_TG: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REAL_VIEW_PASS: ${{ secrets.REAL_VIEW_PASS }}
          REAL_VIEW_PASS_OLD: ${{ secrets.REAL_VIEW_PASS_OLD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          BITVAVO_KEY: ${{ secrets.BITVAVO_KEY }}
          BITVAVO_SECRET: ${{ secrets.BITVAVO_SECRET }}
          OKX_KEY: ${{ secrets.OKX_KEY }}
          OKX_SECRET: ${{ secrets.OKX_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          HL_AGENT_KEY: ${{ secrets.HL_AGENT_KEY }}
          HL_WALLET: ${{ secrets.HL_WALLET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # v1.0 · 🪶 CONSUMO MÍNIMO (24/11/2026): GitHub bloqueó la copia por usar Actions como un servidor encendido todo el día.
          #   Ya no va en cadena (28 min por tramo, las 24 h): UNA vuelta cada 15 min. Las Tortugas deciden con velas diarias y los stops
          #   de emergencia están puestos EN el exchange (Bitvavo y OKX), así que no hace falta mirar cada minuto.
          # 1) Hyperliquid: su ronda de la hora (si ya está hecha, hl-real.mjs no la repite)
          hlP=""; if [ -n "$HL_AGENT_KEY" ]; then ( timeout 720 node runner/hl-real.mjs ronda > /tmp/hl.log 2>&1; cat /tmp/hl.log ) & hlP=$!; fi
          # 2) el vigilante (lanza lo que GitHub se haya saltado) y avisa de arranques fallidos
          ( AVISA_ARRANQUES=1 timeout 90 bash runner/vigia.sh > /tmp/vigia.log 2>&1; grep "⚠️" /tmp/vigia.log || true ) &
          # 3) una vuelta de Bitvavo/OKX
          if timeout 100 node runner/bitvavo.mjs > /tmp/m-bv.log 2>&1; then :; else echo "⚠️ la vuelta de cripto ha fallado"; fi; cat /tmp/m-bv.log
          # si la ronda de Hyperliquid sigue en marcha, se ESPERA a que termine (si no, GitHub la mataría a mitad de abrir o poner stops)
          if [ -n "$hlP" ]; then wait "$hlP" 2>/dev/null || true; fi
          wait 2>/dev/null || true
      - name: Diario para el terminal (cifrado)
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        env:
          DIARIO_LOG: /tmp/diario.jsonl
          REAL_VIEW_PASS: ${{ secrets.REAL_VIEW_PASS }}
          REAL_VIEW_PASS_OLD: ${{ secrets.REAL_VIEW_PASS_OLD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node runner/diario.mjs terminal-cripto-tg
      - name: 🚨 Avisar por Telegram si algo ha fallado
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          QUE: ${{ github.workflow }}
          ENLACE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT" ] || exit 0
          curl -s -m 20 -o /dev/null --data-urlencode "chat_id=$TELEGRAM_CHAT" --data-urlencode "text=🚨 Bot Trading: ha fallado «$QUE» ($(TZ=Europe/Madrid date +'%d/%m %H:%M')). Se volverá a intentar solo; si te llega varias veces seguidas, avísame. Detalle: $ENLACE" "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" || true
