name: Cripto · bot de cada minuto (Bitvavo y OKX · ficticio y, si lo activas, dinero real)

# v218 · solo queda lo que puede dar dinero: Bitvavo (criptos grandes y volátiles en euros, dinero ficticio). Las memecoins, el Turbo,
# Volátiles y Noticias se han parado (el código sigue en el repositorio por si algún día se quieren recuperar). Nunca toca Trading 212.
# CONSTANTE: cada ejecución hace una vuelta completa por minuto (y vigila lo abierto cada ~20 s) durante ~28 min y, al terminar, pide la siguiente (en cadena, las 24 horas).
# Si GitHub cortara la cadena, el horario de abajo la vuelve a arrancar.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: memes
  cancel-in-progress: false

jobs:
  memes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: ¿Ya hay otra cadena esperando?
        id: dup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # v262 · solo se salta si hay OTRA ejecución de verdad en marcha (antes contaba las «en cola» y dos programadas se bloqueaban entre sí)
          v=$(gh api "repos/${{ github.repository }}/actions/workflows/meme.yml/runs?status=in_progress&per_page=10" -q '[.workflow_runs[]|select(.id != ${{ github.run_id }})]|length' 2>/dev/null || echo 0)
          echo "Otras en marcha: $v"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${v:-0}" -gt 0 ] 2>/dev/null; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.dup.outputs.go == 'true'
        with:
          sparse-checkout: runner
      - uses: actions/setup-node@v5
        if: steps.dup.outputs.go == 'true'
        with:
          node-version: 22
      - name: Librerías de firma de Hyperliquid
        if: steps.dup.outputs.go == 'true'
        continue-on-error: true
        run: |
          mkdir -p /tmp/hl && cd /tmp/hl && npm init -y >/dev/null && npm i --no-audit --no-fund ethers@6.13.4 @msgpack/msgpack@2.8.0 >/dev/null && ln -sfn /tmp/hl/node_modules "$GITHUB_WORKSPACE/runner/node_modules" && echo ok
      - name: Vueltas (una por minuto, ~28 min)
        if: steps.dup.outputs.go == 'true'
        env:
          DIARIO_LOG: /tmp/diario.jsonl
          NODE_OPTIONS: --import ${{ github.workspace }}/runner/diario-captura.mjs
          DIARIO_SOLO_TG: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REAL_VIEW_PASS: ${{ secrets.REAL_VIEW_PASS }}
          REAL_VIEW_PASS_OLD: ${{ secrets.REAL_VIEW_PASS_OLD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          BITVAVO_KEY: ${{ secrets.BITVAVO_KEY }}
          BITVAVO_SECRET: ${{ secrets.BITVAVO_SECRET }}
          OKX_KEY: ${{ secrets.OKX_KEY }}
          OKX_SECRET: ${{ secrets.OKX_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          HL_AGENT_KEY: ${{ secrets.HL_AGENT_KEY }}
          HL_WALLET: ${{ secrets.HL_WALLET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          end=$(( $(date +%s) + 28*60 ))
          hlH=""; hlP=""; vg=0
          # v440 · saldo en vivo de Bitvavo y OKX (cada 10 s, cifrado) mientras dura el tramo
          VIVO_SEG=$(( 28*60 - 20 )) node runner/saldo-vivo.mjs > /tmp/vivo.log 2>&1 &
          # una vuelta de Bitvavo por minuto (cada 10 min, además, su generación de aprendizaje)
          while [ "$(date +%s)" -lt "$end" ]; do
            s=$(date +%s)
            # v441 · 💧 Hyperliquid: su ronda de cada hora, en cuanto empieza la hora (en paralelo; si ya está hecha, no repite)
            H=$(date -u +%Y%m%d%H); if [ -n "$HL_AGENT_KEY" ] && [ "$H" != "$hlH" ] && { [ -z "$hlP" ] || ! kill -0 "$hlP" 2>/dev/null; }; then hlH=$H; ( timeout 300 node runner/hl-real.mjs ronda > /tmp/hl.log 2>&1; cat /tmp/hl.log ) & hlP=$!; fi
            # v441 · 🛡️ cada 10 min, el vigilante comprueba que todo lo demás sigue vivo (cartera real, guardián, Hyperliquid…) y lo relanza si no
            if [ $(( $(date +%s) - vg )) -ge 600 ]; then vg=$(date +%s); ( AVISA_ARRANQUES=1 timeout 90 bash runner/vigia.sh > /tmp/vigia.log 2>&1; grep "⚠️" /tmp/vigia.log || true ) & fi
            if timeout 100 node runner/bitvavo.mjs > /tmp/m-bv.log 2>&1; then fb=0; else fb=$(( ${fb:-0} + 1 )); fi; cat /tmp/m-bv.log
            # v451 · 🚨 si el bot de cripto falla 5 vueltas seguidas (5 min), aviso por Telegram (una vez)
            if [ "${fb:-0}" -eq 5 ] && [ -n "$TELEGRAM_TOKEN" ]; then curl -s -m 20 -o /dev/null --data-urlencode "chat_id=$TELEGRAM_CHAT" --data-urlencode "text=🚨 Bot Trading: el bot de cripto (Bitvavo/OKX) lleva 5 minutos fallando en cada vuelta. Sigue reintentando; si no se arregla solo, avísame." "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" || true; fi
            w=$(( 60 - ($(date +%s) - s) )); if [ "$w" -gt 0 ]; then sleep "$w"; fi
          done
          cat /tmp/vivo.log 2>/dev/null || true
      - name: Diario para el terminal (cifrado)
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        env:
          DIARIO_LOG: /tmp/diario.jsonl
          REAL_VIEW_PASS: ${{ secrets.REAL_VIEW_PASS }}
          REAL_VIEW_PASS_OLD: ${{ secrets.REAL_VIEW_PASS_OLD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node runner/diario.mjs terminal-cripto-tg
      - name: ¿Toca examen de las Tortugas? (cada 3 h aunque GitHub se salte la programación)
        if: always() && steps.dup.outputs.go == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # v361 · GitHub se salta a menudo las tareas programadas: si el último examen tiene más de 3 h y no hay otro en marcha, se lanza
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/examen-largo.yml/runs?per_page=1" --jq '.workflow_runs[0] | (.status) + " " + (.created_at)' 2>/dev/null || echo "")
          st=${last%% *}; t=${last#* }
          if [ -n "$t" ] && [ "$st" = "completed" ] && [ $(( $(date +%s) - $(date -d "$t" +%s) )) -gt 10500 ]; then gh api -X POST "repos/${{ github.repository }}/actions/workflows/examen-largo.yml/dispatches" -f ref=main && echo "Examen de las Tortugas pedido (el último tenía más de 3 h)."; else echo "Examen de las Tortugas: al día ($st)."; fi
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/caza-lab.yml/runs?per_page=1" --jq '.workflow_runs[0] | (.status) + " " + (.created_at)' 2>/dev/null || echo "")
          st=${last%% *}; t=${last#* }
          if [ -z "$last" ] || { [ "$st" = "completed" ] && [ $(( $(date +%s) - $(date -d "$t" +%s) )) -gt 21600 ]; }; then gh api -X POST "repos/${{ github.repository }}/actions/workflows/caza-lab.yml/dispatches" -f ref=main && echo "Laboratorio de cripto pedido."; else echo "Laboratorio de cripto: al día ($st)."; fi
      - name: Siguiente tramo (en cadena)
        if: always() && steps.dup.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: for i in 1 2 3 4 5; do timeout 60 gh api -X POST "repos/${{ github.repository }}/actions/workflows/meme.yml/dispatches" -f ref=main && { echo "Siguiente tramo pedido."; exit 0; }; sleep 20; done; exit 1   # v262 · reintenta si GitHub falla
      - name: 🚨 Avisar por Telegram si algo ha fallado
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          QUE: ${{ github.workflow }}
          ENLACE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT" ] || exit 0
          curl -s -m 20 -o /dev/null --data-urlencode "chat_id=$TELEGRAM_CHAT" --data-urlencode "text=🚨 Bot Trading: ha fallado «$QUE» ($(TZ=Europe/Madrid date +'%d/%m %H:%M')). Se volverá a intentar solo; si te llega varias veces seguidas, avísame. Detalle: $ENLACE" "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" || true
