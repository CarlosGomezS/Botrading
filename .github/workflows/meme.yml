name: Memes (solo dinero ficticio)

# v168 · terminal de memecoins con dinero ficticio en Solana, Base y BNB Chain (DexScreener, GeckoTerminal, RugCheck y GoPlus). Nunca toca dinero real ni Trading 212.
# CONSTANTE: cada ejecución hace una vuelta completa por minuto (y vigila lo abierto cada ~20 s) durante ~28 min y, al terminar, pide la siguiente (en cadena, las 24 horas).
# Si GitHub cortara la cadena, el horario de abajo la vuelve a arrancar.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: memes
  cancel-in-progress: false

jobs:
  memes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: ¿Ya hay otra cadena esperando?
        id: dup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          q=$(gh api "repos/${{ github.repository }}/actions/workflows/meme.yml/runs?status=queued&per_page=1" -q .total_count 2>/dev/null || echo 0)
          p=$(gh api "repos/${{ github.repository }}/actions/workflows/meme.yml/runs?status=pending&per_page=1" -q .total_count 2>/dev/null || echo 0)
          echo "En cola: $q · pendientes: $p"
          if [ "${{ github.event_name }}" = "schedule" ] && [ $(( ${q:-0} + ${p:-0} )) -gt 0 ]; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.dup.outputs.go == 'true'
        with:
          sparse-checkout: runner
      - uses: actions/setup-node@v5
        if: steps.dup.outputs.go == 'true'
        with:
          node-version: 22
      - name: Librerías para operar en Solana (solo se usan con dinero real aprobado)
        if: steps.dup.outputs.go == 'true'
        working-directory: runner
        continue-on-error: true
        run: npm install --no-save --no-audit --no-fund @solana/web3.js@1.98.0 bs58@6.0.0 > /tmp/npm.log 2>&1 || tail -5 /tmp/npm.log
      - name: Vueltas (una completa por minuto y vigilancia cada ~20 s, ~28 min)
        if: steps.dup.outputs.go == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REAL_VIEW_PASS: ${{ secrets.REAL_VIEW_PASS }}
          REAL_VIEW_PASS_OLD: ${{ secrets.REAL_VIEW_PASS_OLD }}
          MEME_SOL_KEY: ${{ secrets.MEME_SOL_KEY }}
          MEME_RPC: ${{ secrets.MEME_RPC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: |
          end=$(( $(date +%s) + 28*60 ))
          # v208 · 📰 noticias en segundos: un proceso aparte que mira los anuncios de nuevas criptos cada 3–30 s durante todo el tramo
          timeout 28m node runner/noticias.mjs 27 > /tmp/noticias.log 2>&1 &
          # cada minuto: una vuelta completa y, entre medias, dos vigilancias rápidas de lo abierto (~cada 20 s), para que los stops salten antes
          while [ "$(date +%s)" -lt "$end" ]; do
            # v168 · las tres redes a la vez (Solana, Base y BNB Chain), cada una en su rama
            s=$(date +%s)
            for c in solana base bsc; do timeout 75 node runner/meme.mjs $c > /tmp/m-$c.log 2>&1 & done; timeout 75 node runner/bitvavo.mjs > /tmp/m-bv.log 2>&1 & wait; cat /tmp/m-*.log
            for k in 1 2; do w=$(( s + 20*k - $(date +%s) )); if [ "$w" -gt 0 ]; then sleep "$w"; fi; for c in solana base bsc; do timeout 18 node runner/meme.mjs $c rapido > /tmp/r-$c.log 2>&1 & done; wait; cat /tmp/r-*.log; done
            w=$(( 60 - ($(date +%s) - s) )); if [ "$w" -gt 0 ]; then sleep "$w"; fi
          done
      - name: Siguiente tramo (en cadena)
        if: always() && steps.dup.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: timeout 60 gh api -X POST "repos/${{ github.repository }}/actions/workflows/meme.yml/dispatches" -f ref=main && echo "Siguiente tramo pedido."
