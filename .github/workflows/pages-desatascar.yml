name: Web · desatascar la publicación (GitHub Pages)

# v260 · si una publicación de la web se queda «en curso» y bloquea las siguientes, esto la cancela.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "commit de la publicación atascada"
        required: true

permissions:
  pages: write
  deployments: write

jobs:
  cancelar:
    runs-on: ubuntu-latest
    steps:
      - name: Cancelar la publicación atascada
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_SHA: ${{ inputs.sha }}
        run: |
          echo "$IN_SHA" | grep -Eq '^[0-9a-fA-F]{7,40}$' || { echo "❌ identificador no válido"; exit 1; }   # v295 · validado (no se ejecuta lo que escribas)
          gh api -X POST "repos/${{ github.repository }}/pages/deployments/$IN_SHA/cancel" && echo "cancelada" || echo "no se pudo (quizá ya terminó)"
