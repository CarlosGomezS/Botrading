name: Cartera real · valor en directo (cada 15 min)

# Las 24 horas (cada ~15 min con la bolsa abierta, ~20 min el resto) LEE tu cuenta de Trading 212 y actualiza el valor del bot para la web
# (gráfica y «Dinero del bot hoy»). No envía órdenes, no avisa y no crea informes. Va cifrado igual que todo lo demás.
# v119 · EN CADENA: cada lectura pide la siguiente y espera (v403: ~2-3 min con bolsa abierta, ~20 min el resto).
# v138 · GUARDIÁN 24 HORAS: GitHub a veces no lanza NINGÚN horario durante horas. Por eso esta cadena ya no se para por la
# noche ni el fin de semana: fuera del horario de bolsa no lee la cuenta, solo hace de vigilante (revisión de la cartera real,
# actualización de precios, cadena del laboratorio) y lee los botones de Telegram. El laboratorio, a su vez, la vigila a ella.
on:
  schedule:
    # v1.0 · 🪶 CONSUMO MÍNIMO (24/11/2026): GitHub bloqueó la copia por usar Actions como un servidor encendido todo el día.
    #   Ya no va en cadena: cada 15 min con la bolsa abierta (lunes-viernes 7-21 UTC) y cada 3 h el resto. Solo lee (sin órdenes).
    - cron: "*/15 7-20 * * 1-5"
    - cron: "5 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# una sola cadena: como mucho una en marcha y otra esperando
concurrency:
  group: pulso
  cancel-in-progress: false

jobs:
  # v1.0 · G4-1.5 · GitHub solo deja UNA ejecución esperando por grupo: si «Cartera real» (aprobar, liberar, foto…) está esperando o en marcha,
  #   un pulso que se pusiera a la cola la CANCELARÍA. Por eso, si hay una de «Cartera real» pendiente o en marcha, este pulso se salta (la cadena sigue).
  libre:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ok: ${{ steps.mira.outputs.ok }}
    steps:
      - id: mira
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=0; for st in queued in_progress waiting pending requested; do
            c=$(timeout 30 gh api "repos/${{ github.repository }}/actions/workflows/real.yml/runs?status=$st&per_page=1" -q .total_count 2>/dev/null || echo 1); n=$(( n + ${c:-1} ))
          done
          if [ "$n" -eq 0 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "«Cartera real» está en marcha o esperando: este pulso se salta para no quitarle su turno."; fi
  pulso:
    needs: libre
    if: needs.libre.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # mismo grupo que «Cartera real»: nunca escriben a la vez (la espera de la cadena va aparte, para no bloquearla)
    concurrency:
      group: cartera-real
      cancel-in-progress: false
    steps:
      - name: ¿Leer la cuenta?
        id: hora
        run: |
          D=$(date -u +%u); M=$((10#$(date -u +%H) * 60 + 10#$(date -u +%M)))
          # v157: se lee la cuenta las 24 horas (solo lectura, sin órdenes): al abrir la app siempre ves lo que hay en Trading 212
          echo "go=true" >> "$GITHUB_OUTPUT"; echo "Día $D, minuto $M (UTC): se lee la cuenta."
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.hora.outputs.go == 'true'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.hora.outputs.go == 'true'
        with:
          node-version: 22
      - name: Leer el valor de la cuenta
        if: steps.hora.outputs.go == 'true'
        working-directory: runner
        env:
          DIARIO_LOG: /tmp/diario.jsonl
          NODE_OPTIONS: --import ${{ github.workspace }}/runner/diario-captura.mjs
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCION: pulso
          T212_KEY: ${{ secrets.T212_KEY }}
          T212_SECRET: ${{ secrets.T212_SECRET }}
          REAL_VIEW_PASS: ${{ secrets.REAL_VIEW_PASS }}
          REAL_VIEW_PASS_OLD: ${{ secrets.REAL_VIEW_PASS_OLD }}
        run: node real.mjs
      - name: Diario para el terminal (cifrado)
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        env:
          DIARIO_LOG: /tmp/diario.jsonl
          REAL_VIEW_PASS: ${{ secrets.REAL_VIEW_PASS }}
          REAL_VIEW_PASS_OLD: ${{ secrets.REAL_VIEW_PASS_OLD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node runner/diario.mjs terminal-pulso
      - name: 🚨 Avisar por Telegram si algo ha fallado
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          QUE: ${{ github.workflow }}
          ENLACE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT" ] || exit 0
          curl -s -m 20 -o /dev/null --data-urlencode "chat_id=$TELEGRAM_CHAT" --data-urlencode "text=🚨 Bot Trading: ha fallado «$QUE» ($(TZ=Europe/Madrid date +'%d/%m %H:%M')). Se volverá a intentar solo; si te llega varias veces seguidas, avísame. Detalle: $ENLACE" "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" || true
