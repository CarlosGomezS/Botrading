name: Cartera real · valor en directo (cada 15 min)

# Con la bolsa abierta, cada ~15 minutos LEE tu cuenta de Trading 212 y actualiza el valor del bot para la web
# (gráfica y «Dinero del bot hoy»). No envía órdenes, no avisa y no crea informes. Va cifrado igual que todo lo demás.
# v119 · EN CADENA: cada lectura pide la siguiente y espera ~14 min.
# v138 · GUARDIÁN 24 HORAS: GitHub a veces no lanza NINGÚN horario durante horas. Por eso esta cadena ya no se para por la
# noche ni el fin de semana: fuera del horario de bolsa no lee la cuenta, solo hace de vigilante (revisión de la cartera real,
# actualización de precios, cadena del laboratorio) y lee los botones de Telegram. El laboratorio, a su vez, la vigila a ella.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# una sola cadena: como mucho una en marcha y otra esperando
concurrency:
  group: pulso
  cancel-in-progress: false

jobs:
  pulso:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # mismo grupo que «Cartera real»: nunca escriben a la vez (la espera de la cadena va aparte, para no bloquearla)
    concurrency:
      group: cartera-real
      cancel-in-progress: false
    steps:
      - name: ¿Bolsa abierta?
        id: hora
        run: |
          D=$(date -u +%u); M=$((10#$(date -u +%H) * 60 + 10#$(date -u +%M)))
          if [ "$D" -le 5 ] && [ "$M" -ge 420 ] && [ "$M" -le 1000 ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; echo "Bolsa cerrada: no se lee la cuenta."; fi
      - uses: actions/checkout@v5
        if: steps.hora.outputs.go == 'true'
      - uses: actions/setup-node@v5
        if: steps.hora.outputs.go == 'true'
        with:
          node-version: 22
      - name: Leer el valor de la cuenta
        if: steps.hora.outputs.go == 'true'
        working-directory: runner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCION: pulso
          T212_KEY: ${{ secrets.T212_KEY }}
          T212_SECRET: ${{ secrets.T212_SECRET }}
          REAL_VIEW_PASS: ${{ secrets.REAL_VIEW_PASS }}
          REAL_VIEW_PASS_OLD: ${{ secrets.REAL_VIEW_PASS_OLD }}
        run: node real.mjs
  cadena:
    needs: pulso
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: runner
      - name: Siguiente vuelta (en cadena, las 24 horas)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: |
          R="repos/${{ github.repository }}/actions/workflows/real-pulso.yml"
          # primero se pide la siguiente vuelta (queda en cola): aunque algo fallara después, la cadena no se corta
          timeout 60 gh api -X POST "$R/dispatches" -f ref=main && echo "Siguiente vuelta pedida."
          timeout 90 bash runner/vigia.sh || true
          D=$(date -u +%u); M=$((10#$(date -u +%H) * 60 + 10#$(date -u +%M)))
          if [ "$D" -le 5 ] && [ "$M" -ge 420 ] && [ "$M" -le 1000 ]; then T=840; else T=1200; fi
          # mientras espera, lee los botones de Telegram cada ~2,5 min (si el flujo de Telegram no está ya en marcha) y vuelve a vigilar a mitad
          end=$(( $(date +%s) + T )); half=$(( $(date +%s) + T / 2 )); vh=0
          while [ "$(date +%s)" -lt "$end" ]; do
            tg=$(timeout 30 gh api "repos/${{ github.repository }}/actions/workflows/telegram.yml/runs?status=in_progress&per_page=1" -q .total_count 2>/dev/null || echo 0)
            if [ "${tg:-0}" -eq 0 ]; then timeout 120 node runner/telegram.mjs || true; fi
            if [ "$vh" = 0 ] && [ "$(date +%s)" -ge "$half" ]; then vh=1; timeout 90 bash runner/vigia.sh || true; fi
            left=$(( end - $(date +%s) )); [ "$left" -gt 0 ] && sleep $(( left < 150 ? left : 150 ))
          done
