name: Cripto · laboratorio dedicado (solo dinero ficticio)

# v245 · 90 días compartidos (los descarga «eq» una vez), examen en tres tramos, termómetro del mercado y cruce entre laboratorios.
# v227 · 🚀 tres procesos (uno por submodo de «IA y laboratorio») que prueban reglas SIN PARAR con 30 días de velas de Bitvavo,
# reentrenan la IA y reaprenden las rejillas. Cada tramo dura ~50 min y pide el siguiente (en cadena, las 24 horas).
# El bot de cada minuto (meme.yml) recoge lo demostrado cada 3 min. Nunca toca dinero real ni Trading 212.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: cripto-lab
  cancel-in-progress: false

jobs:
  # v266 · dos máquinas: una con los laboratorios de Bitvavo (todas sus criptos) y otra con los de OKX (solo las criptos de OKX)
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.dup.outputs.go }}
    steps:
      - name: ¿Ya hay otro tramo en marcha?
        id: dup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(gh api "repos/${{ github.repository }}/actions/workflows/cripto-lab.yml/runs?status=in_progress&per_page=10" -q '[.workflow_runs[]|select(.id != ${{ github.run_id }})]|length' 2>/dev/null || echo 0)
          echo "Otras en marcha: $v"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${v:-0}" -gt 0 ] 2>/dev/null; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
  lab:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - grupo: bitvavo
            labs: "eq turbo mix cuant consenso tend explora riesgo"
            baja: eq
          - grupo: okx
            labs: "mixokx eqokx turbookx cuantokx consensookx tendokx exploraokx riesgookx"
            baja: mixokx
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: runner
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Laboratorios ${{ matrix.grupo }} (en paralelo, ~50 min)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REAL_VIEW_PASS: ${{ secrets.REAL_VIEW_PASS }}
          REAL_VIEW_PASS_OLD: ${{ secrets.REAL_VIEW_PASS_OLD }}
          LAB_BAJA: ${{ matrix.baja }}
        run: |
          for k in ${{ matrix.labs }}; do (timeout 3240 node --max-old-space-size=3072 runner/bitvavo-lab.mjs $k 48 > /tmp/lab-$k.log 2>&1 || true) & done
          wait || true
          for k in ${{ matrix.labs }}; do echo "=== $k"; tail -n 60 /tmp/lab-$k.log; done
  siguiente:
    needs: [check, lab]
    if: always() && needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Siguiente tramo (en cadena)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: for i in 1 2 3 4 5; do timeout 60 gh api -X POST "repos/${{ github.repository }}/actions/workflows/cripto-lab.yml/dispatches" -f ref=main && { echo "Siguiente tramo pedido."; exit 0; }; sleep 20; done; exit 1   # reintenta si GitHub falla
