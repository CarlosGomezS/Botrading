name: Claves · copiar las comunes a otra app tuya
on:
  workflow_dispatch:
    inputs:
      destino:
        description: "Repositorio de destino (dueño/nombre)"
        required: true
      chat:
        description: "Claves del chat, ya cifradas con la clave de la app de destino (opcional)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  copiar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: runner
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: cd runner && npm i --no-save --no-audit --no-fund libsodium-wrappers@0.7.15 >/dev/null 2>&1 && node copiar-claves.mjs
        env:
          DESTINO: ${{ inputs.destino }}
          CHAT: ${{ inputs.chat }}
          DESTINO_TOKEN: ${{ secrets.DESTINO_TOKEN }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          POLYGON_KEY: ${{ secrets.POLYGON_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          NVIDIA_KEY: ${{ secrets.NVIDIA_KEY }}
          ZAI_KEY: ${{ secrets.ZAI_KEY }}
      - name: 🚨 Avisar por Telegram si algo ha fallado
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          QUE: ${{ github.workflow }}
          ENLACE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT" ] || exit 0
          curl -s -m 20 -o /dev/null --data-urlencode "chat_id=$TELEGRAM_CHAT" --data-urlencode "text=🚨 Bot Trading: ha fallado «$QUE» ($(TZ=Europe/Madrid date +'%d/%m %H:%M')). Se volverá a intentar solo; si te llega varias veces seguidas, avísame. Detalle: $ENLACE" "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" || true
