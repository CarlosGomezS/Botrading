name: Bolsa · examen del rebote de las grandes (10 años)
on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"
permissions:
  contents: write
jobs:
  examen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: runner
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Examen rebote de las grandes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: timeout 900 node runner/rebotes.mjs examen
