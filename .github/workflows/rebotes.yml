name: Bolsa · examen del rebote de las grandes (10 años)
on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"
permissions:
  contents: write
jobs:
  examen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: runner
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Examen rebote de las grandes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: timeout 900 node runner/rebotes.mjs examen
