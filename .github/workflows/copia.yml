name: Copia de seguridad · código y datos (cada día)

# v264 · 💾 cada día (y cuando la pidas) guarda una foto de TODAS las ramas (código en main y datos de cada bot) como etiquetas
#   copia/AAAA-MM-DD/<rama>. Git no duplica lo que no cambia, así que ocupa muy poco. Se guardan los últimos 60 días.
#   Lo que va cifrado sigue cifrado en la copia. Para volver atrás: «Restaurar una copia de seguridad».
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: copia
  cancel-in-progress: false

jobs:
  copia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Foto de todas las ramas
        run: |
          set -e
          git fetch --prune origin "+refs/heads/*:refs/remotes/origin/*" --tags
          d=$(TZ=Europe/Madrid date +%F); n=0
          for b in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -v '^HEAD$'); do
            git tag -f "copia/$d/$b" "refs/remotes/origin/$b" >/dev/null; n=$((n+1))
          done
          git push -f origin "refs/tags/copia/$d/*:refs/tags/copia/$d/*" 2>&1 | tail -2
          echo "💾 Copia $d: $n ramas guardadas"
          # se borran las copias de hace más de 60 días
          lim=$(TZ=Europe/Madrid date -d '-60 days' +%F)
          for t in $(git tag -l 'copia/*'); do f=$(echo "$t" | cut -d/ -f2); if [[ "$f" < "$lim" ]]; then git push -q origin ":refs/tags/$t" || true; fi; done
          echo "Copias disponibles:"; git ls-remote --tags origin 'copia/*' | sed 's|.*refs/tags/copia/||' | cut -d/ -f1 | sort -u | tail -10
